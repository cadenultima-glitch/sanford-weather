```javascript
const STATIONS=["KSFB","KMCO"];

function $(id){
return document.getElementById(id);
}

function updateDayNight(){

const h=new Date().getHours();

document.body.classList.toggle("night",h<6||h>=19);

}

function weatherIcon(text,isDay){

text=(text||"").toLowerCase();

if(text.includes("thunder")) return "⛈️";
if(text.includes("rain")) return "🌧️";
if(text.includes("drizzle")) return "🌦️";
if(text.includes("snow")) return "❄️";
if(text.includes("fog")) return "🌫️";
if(text.includes("cloud")) return "☁️";

return isDay?"☀️":"🌙";

}

async function observation(station){

const r=await fetch(
"https://api.weather.gov/stations/"+station+"/observations/latest"
);

if(!r.ok) throw new Error();

const j=await r.json();

const p=j.properties;

if(p.temperature.value==null) throw new Error();

return{
station,
temp:p.temperature.value*9/5+32,
wind:p.windSpeed.value==null?0:p.windSpeed.value*0.621371,
humidity:p.relativeHumidity.value,
visibility:p.visibility.value==null?0:p.visibility.value/1609.34,
condition:p.textDescription,
isDay:!/\\/night\\//.test(p.icon||"")
};

}

async function loadWeather(){

for(const s of STATIONS){

try{

const w=await observation(s);

$("temp").textContent=Math.round(w.temp)+"°";

$("condition").textContent=w.condition;

$("wind").textContent=Math.round(w.wind)+" mph";

$("humidity").textContent=
Math.round(w.humidity)+"%";

$("visibility").textContent=
Math.round(w.visibility)+" mi";

$("feels").textContent=
Math.round(w.temp)+"°";

$("icon").textContent=
weatherIcon(w.condition,w.isDay);

updateDayNight();

return;

}catch(e){}

}

$("condition").textContent="Couldn't load weather.";

}

$("refresh").onclick=loadWeather;

loadWeather();

setInterval(loadWeather,300000);
```
