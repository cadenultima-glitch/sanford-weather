<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanford SkyStation</title>
<style>
:root{--top:#1f6fd1;--bot:#5aaef0;--glass:rgba(8,20,45,.32);--line:rgba(255,255,255,.2)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,var(--top),var(--bot)) fixed;transition:background .8s}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.cloud{position:absolute;width:420px;height:120px;border-radius:50%;background:#fff;filter:blur(40px);opacity:.22;animation:drift 70s linear infinite}
.c1{top:8%;left:-420px}.c2{top:38%;left:-420px;animation-duration:110s;animation-delay:-40s}.c3{top:68%;left:-420px;animation-duration:90s;animation-delay:-70s}
body.cloudy .cloud{opacity:.5}
.rain{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(255,255,255,.28) 22px 23px);animation:rain .6s linear infinite;transition:opacity 1s}
body.rainy .rain{opacity:.5}
body.night .sky::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 47% 12%,#fff,transparent),radial-gradient(1px 1px at 63% 38%,#fff,transparent),radial-gradient(2px 2px at 78% 22%,#fff,transparent),radial-gradient(1px 1px at 90% 70%,#fff,transparent),radial-gradient(1px 1px at 8% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 85%,#fff,transparent);animation:tw 5s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(calc(100vw + 840px))}}
@keyframes rain{to{background-position:-30px 60px}}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.wrap{position:relative;max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:1.5rem;font-weight:600}
.meta{opacity:.85;font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85rem}
.dot{width:9px;height:9px;border-radius:50%;background:#7CFC9A}
.dot.stale{background:#ffc857}.dot.err{background:#ff6b6b}
button{font:inherit;font-size:.85rem;color:#fff;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
button:hover{background:rgba(255,255,255,.2)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h2{margin:0 0 12px;font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.big{display:flex;align-items:center;gap:14px}
.ico{font-size:clamp(4rem,14vw,6rem);line-height:1}
.temp{font-size:clamp(4.5rem,16vw,8rem);font-weight:200;line-height:1}
.cond{font-size:1.4rem;margin-top:4px}
.sub{opacity:.85;margin-top:4px}
.sum{flex:1 1 280px;max-width:420px;line-height:1.5;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:14px}
.stats .card{margin:0;padding:16px}
.val{font-size:1.6rem;margin-top:2px}
.small{font-size:.85rem;opacity:.8;margin-top:4px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px}
.arrow{display:inline-block;transition:transform .6s}
#chart svg{width:100%;height:auto;display:block}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.h{flex:0 0 66px;text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.08);scroll-snap-align:start}
.h b{display:block;font-weight:500;font-size:1.05rem}
.h span{display:block;font-size:.75rem;opacity:.8}
.day{border-top:1px solid var(--line)}
.day:first-child{border-top:0}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:78px 34px 46px 38px 1fr 38px;gap:8px;align-items:center;padding:12px 0}
summary::-webkit-details-marker{display:none}
.rng{height:6px;border-radius:3px;background:rgba(255,255,255,.18);position:relative}
.rng i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#8fd0ff,#ffd166,#ff8a5b)}
.pop{font-size:.8rem;opacity:.85}
.lo{opacity:.7;text-align:right}.hi{text-align:right;font-weight:600}
.detail{padding:0 0 14px;opacity:.9;line-height:1.5;font-size:.95rem}
.alert{border-radius:14px;padding:12px 16px;margin-bottom:12px;background:#b3261e;border:1px solid rgba(255,255,255,.35)}
.alert.mod{background:#b4570b}.alert.minor{background:#8a6d00}
.alert summary{display:block;padding:0;font-weight:600}
.alert p{margin:8px 0 0;font-size:.9rem;line-height:1.5;white-space:pre-line}
footer{text-align:center;font-size:.8rem;opacity:.7;margin-top:20px;line-height:1.6}
@media(max-width:520px){summary{grid-template-columns:60px 30px 40px 34px 1fr 34px;gap:6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="rain"></div></div>
<div class="wrap">
  <header>
    <div><h1>Sanford SkyStation</h1><div class="meta"><span id="clock">--</span> · Sanford, Florida</div></div>
    <div class="tools">
      <span class="pill" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="status">Initializing</span></span>
      <span class="pill" id="next">Next update --:--</span>
      <button id="unit" type="button">Switch to °C</button>
      <button id="refresh" type="button">Update</button>
    </div>
  </header>
  <div id="alerts"></div>
  <section class="card hero" id="hero"><div class="big"><div class="ico">⏳</div><div><div class="temp">--°</div><div class="cond">Syncing server...</div></div></div></section>
  <section class="stats" id="stats"></section>
  <section class="card"><h2>Next 24 hours</h2><div id="chart"></div><div class="hours" id="hours"></div></section>
  <section class="card"><h2>5-day forecast</h2><div id="days"></div></section>
  <footer>Data: National Weather Service (api.weather.gov) · Station KSFB, Orlando Sanford International<br>For entertainment only. In an emergency, follow official alerts.</footer>
</div>

<script>
(function () {
  "use strict";
  var LAT = 28.8003, LON = -81.2731, TZ = "America/New_York";
  var API = "https://api.weather.gov", STATIONS = ["KSFB", "KMCO"];
  var OBS_MS = 5 * 60 * 1000, FC_MS = 30 * 60 * 1000;
  var S = { units: "imperial", obs: null, daily: null, hourly: null, alerts: [], open: {}, nextObs: 0, nextFc: 0, busy: false, grid: null, ok: false };
  var SKY = { clearDay: ["#1f6fd1", "#5aaef0"], cloudDay: ["#4a6a92", "#8fa6c2"], rain: ["#2f3b4e", "#65768d"], storm: ["#1d1833", "#454e6e"], clearNight: ["#070d24", "#25346b"], cloudNight: ["#0f1829", "#34415c"] };
  var COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function getJSON(url, tries) {
    var err;
    for (var i = 0; i < (tries || 3); i++) {
      try {
        var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 12000);
        var r = await fetch(url, { signal: ctl.signal });
        clearTimeout(t);
        if (!r.ok) throw new Error("HTTP " + r.status);
        return await r.json();
      } catch (e) { err = e; await sleep(700 * (i + 1)); }
    }
    throw err;
  }

  /* ---------- unit helpers (data is stored imperial) ---------- */
  var imp = function () { return S.units === "imperial"; };
  function T(f) { return Math.round(imp() ? f : (f - 32) * 5 / 9); }
  function W(mph) { return imp() ? Math.round(mph) + " mph" : Math.round(mph * 1.609344) + " km/h"; }
  function WS(str) { return imp() ? str : String(str).replace(/\d+/g, function (n) { return Math.round(n * 1.609344); }).replace("mph", "km/h"); }
  function fmtTime(d) { return new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ }); }
  function fmtHour(d) { return new Date(d).toLocaleTimeString("en-US", { hour: "numeric", timeZone: TZ }); }

  function iconFor(text, day) {
    var t = (text || "").toLowerCase();
    if (/thunder|t-storm/.test(t)) return "⛈️";
    if (/snow|flurr|sleet|ice|wintry/.test(t)) return "🌨️";
    if (/fog|haze|mist|smoke/.test(t)) return "🌫️";
    if (/rain|shower|drizzle/.test(t)) return /chance|slight|isolated|scattered/.test(t) && day ? "🌦️" : "🌧️";
    if (/overcast|mostly cloudy|^cloudy/.test(t)) return "☁️";
    if (/partly|scattered|few clouds/.test(t)) return day ? "⛅" : "☁️";
    if (/mostly sunny|mostly clear|mainly/.test(t)) return day ? "🌤️" : "🌙";
    if (/sunny|clear|fair/.test(t)) return day ? "☀️" : "🌙";
    return day ? "🌤️" : "🌙";
  }

  function feels(f, rh, wind) {
    if (f >= 80 && rh != null && rh >= 40)
      return -42.379 + 2.04901523 * f + 10.14333127 * rh - 0.22475541 * f * rh - 0.00683783 * f * f - 0.05481717 * rh * rh + 0.00122874 * f * f * rh + 0.00085282 * f * rh * rh - 0.00000199 * f * f * rh * rh;
    if (f <= 50 && wind != null && wind > 3) { var p = Math.pow(wind, 0.16); return 35.74 + 0.6215 * f - 35.75 * p + 0.4275 * f * p; }
    return f;
  }

  /* ---------- data ---------- */
  function normObs(o) {
    var p = o.p, c2f = function (c) { return c == null ? null : c * 9 / 5 + 32; }, kmh = function (v) { return v == null ? null : v * 0.621371; };
    return { station: o.station, time: p.timestamp, text: p.textDescription || "", isDay: !/\/night\//.test(p.icon || ""),
      tempF: c2f(p.temperature.value), rh: p.relativeHumidity.value, wind: kmh(p.windSpeed.value), gust: kmh(p.windGust.value), dir: p.windDirection.value,
      dewF: c2f(p.dewpoint.value), inHg: p.barometricPressure.value == null ? null : p.barometricPressure.value / 3386.389,
      visMi: p.visibility.value == null ? null : p.visibility.value / 1609.344 };
  }

  async function fetchObs() {
    var last;
    for (var i = 0; i < STATIONS.length; i++) {
      try {
        var d = await getJSON(API + "/stations/" + STATIONS[i] + "/observations/latest", 2);
        if (d.properties.temperature.value !== null) return normObs({ station: STATIONS[i], p: d.properties });
      } catch (e) { last = e; }
    }
    throw last || new Error("No station data");
  }

  async function fetchAlerts() {
    var d = await getJSON(API + "/alerts/active?point=" + LAT + "," + LON, 2);
    return d.features.map(function (f) { return f.properties; });
  }

  async function fetchForecast() {
    if (!S.grid) {
      var pt = await getJSON(API + "/points/" + LAT + "," + LON);
      S.grid = { daily: pt.properties.forecast, hourly: pt.properties.forecastHourly };
    }
    var r = await Promise.all([getJSON(S.grid.daily), getJSON(S.grid.hourly)]);
    return { daily: r[0].properties.periods, hourly: r[1].properties.periods.slice(0, 24) };
  }

  function groupDays(periods) {
    var map = {}, order = [];
    periods.forEach(function (p) {
      var k = p.startTime.slice(0, 10);
      if (!map[k]) { map[k] = { key: k, day: null, nights: [], pop: 0 }; order.push(k); }
      var g = map[k], pop = p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value || 0;
      g.pop = Math.max(g.pop, pop);
      if (p.isDaytime) g.day = p; else g.nights.push(p);
    });
    return order.slice(0, 5).map(function (k, i) {
      var g = map[k], main = g.day || g.nights[g.nights.length - 1];
      var lows = g.nights.map(function (n) { return n.temperature; });
      return { key: k, first: i === 0, label: i === 0 ? (g.day ? "Today" : "Tonight") : new Date(k + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" }),
        date: new Date(k + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }),
        hi: g.day ? g.day.temperature : null, lo: lows.length ? Math.min.apply(null, lows) : null, pop: g.pop,
        icon: iconFor(main.shortForecast, true), short: main.shortForecast, text: main.detailedForecast, wind: main.windSpeed + " " + main.windDirection };
    });
  }

  /* ---------- rendering ---------- */
  function applySky(text, isDay) {
    var t = (text || "").toLowerCase(), key;
    if (/thunder/.test(t)) key = "storm";
    else if (/rain|shower|drizzle/.test(t)) key = "rain";
    else if (/overcast|mostly cloudy|^cloudy|fog/.test(t)) key = isDay ? "cloudDay" : "cloudNight";
    else key = isDay ? "clearDay" : "clearNight";
    document.documentElement.style.setProperty("--top", SKY[key][0]);
    document.documentElement.style.setProperty("--bot", SKY[key][1]);
    document.body.classList.toggle("night", !isDay);
    document.body.classList.toggle("rainy", key === "rain" || key === "storm");
    document.body.classList.toggle("cloudy", /cloud/.test(key) || key === "rain" || key === "storm");
  }

  function renderHero() {
    var o = S.obs; if (!o) return;
    var fl = feels(o.tempF, o.rh, o.wind), today = S.daily && S.daily[0];
    var hi = today && today.hi != null ? "H " + T(today.hi) + "°" : "", lo = today && today.lo != null ? "L " + T(today.lo) + "°" : "";
    $("hero").innerHTML =
      '<div class="big"><div class="ico">' + iconFor(o.text, o.isDay) + '</div><div><div class="temp">' + T(o.tempF) + '°</div></div></div>' +
      '<div><div class="cond">' + esc(o.text || "Conditions unavailable") + '</div>' +
      '<div class="sub">Feels like ' + T(fl) + '° ' + (hi || lo ? "· " + hi + " " + lo : "") + '</div>' +
      '<div class="sub">Observed ' + fmtTime(o.time) + ' at ' + esc(o.station) + '</div></div>' +
      (today ? '<div class="sum">' + esc(WS(today.text)) + '</div>' : "");
    applySky(o.text, o.isDay);
    document.title = T(o.tempF) + "°" + (imp() ? "F" : "C") + " · Sanford SkyStation";
  }

  function renderStats() {
    var o = S.obs; if (!o) return;
    var pop = S.hourly && S.hourly[0] ? (S.hourly[0].probabilityOfPrecipitation.value || 0) : null;
    var card = function (h, v, s, extra) { return '<div class="card"><h2>' + h + '</h2><div class="val">' + v + '</div>' + (s ? '<div class="small">' + s + '</div>' : "") + (extra || "") + '</div>'; };
    $("stats").innerHTML =
      card("Wind", o.wind == null ? "Calm" : W(o.wind), (o.dir != null ? '<span class="arrow" style="transform:rotate(' + (o.dir + 180) + 'deg)">↑</span> from ' + COMPASS[Math.round(o.dir / 22.5) % 16] : "") + (o.gust ? " · gusts " + W(o.gust) : "")) +
      card("Humidity", o.rh == null ? "--" : Math.round(o.rh) + "%", "", o.rh == null ? "" : '<div class="bar"><i style="width:' + Math.round(o.rh) + '%"></i></div>') +
      card("Dew point", o.dewF == null ? "--" : T(o.dewF) + "°", o.dewF == null ? "" : o.dewF >= 70 ? "Muggy" : o.dewF >= 60 ? "Humid" : o.dewF >= 50 ? "Comfortable" : "Dry") +
      card("Rain chance", pop == null ? "--" : pop + "%", "This hour", pop == null ? "" : '<div class="bar"><i style="width:' + pop + '%"></i></div>') +
      card("Pressure", o.inHg == null ? "--" : imp() ? o.inHg.toFixed(2) + " in" : Math.round(o.inHg * 33.8639) + " hPa", "") +
      card("Visibility", o.visMi == null ? "--" : imp() ? Math.round(o.visMi) + " mi" : Math.round(o.visMi * 1.609) + " km", "");
  }

  function renderHours() {
    var h = S.hourly; if (!h || !h.length) return;
    var temps = h.map(function (p) { return p.temperature; }), min = Math.min.apply(null, temps), max = Math.max.apply(null, temps);
    var w = 900, ht = 150, pad = 28, n = h.length;
    var X = function (i) { return pad + i * (w - 2 * pad) / (n - 1); };
    var Y = function (t) { return ht - pad - (t - min) / ((max - min) || 1) * (ht - 2 * pad); };
    var line = temps.map(function (t, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(t).toFixed(1); }).join(" ");
    var labels = temps.map(function (t, i) {
      if (i % 3) return "";
      return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(t).toFixed(1) + '" r="4" fill="#fff"/><text x="' + X(i).toFixed(1) + '" y="' + (Y(t) - 10).toFixed(1) + '" text-anchor="middle" fill="#fff" font-size="15">' + T(t) + '°</text>' +
        '<text x="' + X(i).toFixed(1) + '" y="' + (ht - 4) + '" text-anchor="middle" fill="#fff" opacity=".7" font-size="12">' + fmtHour(h[i].startTime) + '</text>';
    }).join("");
    $("chart").innerHTML = '<svg viewBox="0 0 ' + w + ' ' + ht + '" role="img" aria-label="Temperature for the next 24 hours"><path d="' + line + ' L' + X(n - 1) + ' ' + (ht - pad) + ' L' + X(0) + ' ' + (ht - pad) + ' Z" fill="rgba(255,255,255,.14)"/><path d="' + line + '" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>' + labels + '</svg>';
    $("hours").innerHTML = h.map(function (p) {
      var pop = p.probabilityOfPrecipitation.value || 0;
      return '<div class="h"><span>' + fmtHour(p.startTime) + '</span><b>' + iconFor(p.shortForecast, p.isDaytime) + '</b><b>' + T(p.temperature) + '°</b><span>' + (pop ? "💧" + pop + "%" : "&nbsp;") + '</span></div>';
    }).join("");
  }

  function renderDays() {
    if (!S.daily) return;
    var days = groupDays(S.daily), all = [];
    days.forEach(function (d) { if (d.hi != null) all.push(d.hi); if (d.lo != null) all.push(d.lo); });
    var min = Math.min.apply(null, all), max = Math.max.apply(null, all), span = (max - min) || 1;
    $("days").innerHTML = days.map(function (d) {
      var lo = d.lo != null ? d.lo : d.hi, hi = d.hi != null ? d.hi : d.lo;
      return '<details class="day" data-k="' + d.key + '"' + (S.open[d.key] ? " open" : "") + '><summary>' +
        '<span><b>' + d.label + '</b><br><span class="pop">' + d.date + '</span></span><span style="font-size:1.5rem" title="' + esc(d.short) + '">' + d.icon + '</span>' +
        '<span class="pop">' + (d.pop ? "💧" + d.pop + "%" : "") + '</span><span class="lo">' + (d.lo != null ? T(d.lo) + "°" : "") + '</span>' +
        '<span class="rng"><i style="left:' + ((lo - min) / span * 100).toFixed(1) + '%;right:' + ((max - hi) / span * 100).toFixed(1) + '%"></i></span>' +
        '<span class="hi">' + (d.hi != null ? T(d.hi) + "°" : "--") + '</span></summary>' +
        '<div class="detail"><b>' + esc(d.short) + '</b> · Wind ' + esc(WS(d.wind)) + '<br>' + esc(WS(d.text)) + '</div></details>';
    }).join("");
  }

  function renderAlerts() {
    $("alerts").innerHTML = (S.alerts || []).slice(0, 4).map(function (a) {
      var cls = /Extreme|Severe/.test(a.severity) ? "" : a.severity === "Moderate" ? "mod" : "minor";
      return '<details class="alert ' + cls + '"><summary>⚠️ ' + esc(a.headline || a.event) + '</summary><p>' + esc(a.description || "") + (a.instruction ? "\n\n" + esc(a.instruction) : "") + '</p></details>';
    }).join("");
  }

  function renderAll() { renderHero(); renderStats(); renderHours(); renderDays(); renderAlerts(); }

  function setStatus(kind, msg) {
    $("dot").className = "dot" + (kind === "live" ? "" : kind === "stale" ? " stale" : " err");
    $("status").textContent = msg;
  }

  /* ---------- refresh logic ---------- */
  function persist() { save("skystation:v1", { obs: S.obs, daily: S.daily, hourly: S.hourly, alerts: S.alerts, at: Date.now() }); }

  async function refreshObs() {
    S.nextObs = Date.now() + OBS_MS;
    var r = await Promise.allSettled([fetchObs(), fetchAlerts()]);
    if (r[0].status === "fulfilled") { S.obs = r[0].value; S.ok = true; setStatus("live", "Live · updated " + fmtTime(Date.now())); }
    else { S.nextObs = Date.now() + 60000; setStatus(S.obs ? "stale" : "err", S.obs ? "Offline · showing saved data" : "Error: " + r[0].reason.message); }
    if (r[1].status === "fulfilled") S.alerts = r[1].value;
    renderHero(); renderStats(); renderAlerts(); persist();
  }

  async function refreshFc() {
    S.nextFc = Date.now() + FC_MS;
    try { var f = await fetchForecast(); S.daily = f.daily; S.hourly = f.hourly; }
    catch (e) { S.nextFc = Date.now() + 60000; if (!S.daily) $("days").textContent = "Forecast unavailable: " + e.message; }
    renderHero(); renderStats(); renderHours(); renderDays(); persist();
  }

  async function refreshAll() {
    if (S.busy) return;
    S.busy = true; $("refresh").disabled = true; $("status").textContent = "Updating...";
    try { await Promise.all([refreshObs(), refreshFc()]); } finally { S.busy = false; $("refresh").disabled = false; }
  }

  function tick() {
    var now = Date.now();
    $("clock").textContent = new Date().toLocaleString("en-US", { weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: TZ });
    var left = Math.max(0, S.nextObs - now), m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    $("next").textContent = document.hidden ? "Paused (tab hidden)" : "Next update " + m + ":" + (s < 10 ? "0" : "") + s;
    if (document.hidden || S.busy) return;
    if (now >= S.nextFc) { S.busy = true; refreshFc().finally(function () { S.busy = false; }); }
    else if (now >= S.nextObs) { S.busy = true; refreshObs().finally(function () { S.busy = false; }); }
  }

  /* ---------- init ---------- */
  var u = load("skystation:units"); if (u === "metric" || u === "imperial") S.units = u;
  function syncUnitBtn() { $("unit").textContent = imp() ? "Switch to °C" : "Switch to °F"; }
  syncUnitBtn();
  $("unit").addEventListener("click", function () { S.units = imp() ? "metric" : "imperial"; save("skystation:units", S.units); syncUnitBtn(); renderAll(); });
  $("refresh").addEventListener("click", refreshAll);
  $("days").addEventListener("toggle", function (e) { var k = e.target.getAttribute("data-k"); if (k) S.open[k] = e.target.open; }, true);

  var cached = load("skystation:v1");
  if (cached && cached.obs) { S.obs = cached.obs; S.daily = cached.daily; S.hourly = cached.hourly; S.alerts = cached.alerts || []; renderAll(); setStatus("stale", "Saved data · refreshing"); }
  setInterval(tick, 1000);
  refreshAll();
})();
</script>
</body>
</html>
