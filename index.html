<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanford SkyStation</title>

<style>

:root{
--skyTop:#3b82f6;
--skyBottom:#93c5fd;
--glass:rgba(255,255,255,.18);
--border:rgba(255,255,255,.25);
--shadow:0 20px 50px rgba(0,0,0,.25);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(180deg,var(--skyTop),var(--skyBottom));
background-attachment:fixed;
color:white;
min-height:100vh;
overflow-x:hidden;
transition:background 1s ease;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.20),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(255,255,255,.15),transparent 30%);
pointer-events:none;
animation:floatClouds 18s ease-in-out infinite alternate;
}

@keyframes floatClouds{

0%{
transform:translateY(0px);
}

100%{
transform:translateY(-25px);
}

}

main{

max-width:470px;

margin:auto;

padding:24px;

text-align:center;

}

.header{

margin-top:25px;

margin-bottom:30px;

}

.header h1{

font-size:2rem;

font-weight:700;

}

.header p{

opacity:.85;

margin-top:6px;

}

.hero{

background:var(--glass);

border:1px solid var(--border);

backdrop-filter:blur(18px);

border-radius:30px;

padding:30px;

box-shadow:var(--shadow);

}

#icon{

font-size:82px;

margin-bottom:10px;

animation:bounce 4s ease-in-out infinite;

}

@keyframes bounce{

0%,100%{

transform:translateY(0px);

}

50%{

transform:translateY(-8px);

}

}

.temp{

font-size:88px;

font-weight:200;

line-height:1;

}

.desc{

margin-top:8px;

font-size:1.25rem;

opacity:.95;

min-height:30px;

}

.feels{

margin-top:8px;

opacity:.8;

font-size:.95rem;

}

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:14px;

margin-top:22px;

}

.card{

background:var(--glass);

border:1px solid var(--border);

border-radius:22px;

padding:18px;

backdrop-filter:blur(16px);

box-shadow:var(--shadow);

}

.label{

font-size:.82rem;

opacity:.75;

}

.value{

font-size:1.5rem;

margin-top:8px;

font-weight:600;

}.status{

margin-top:24px;

opacity:.85;

font-size:.95rem;

}

button{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:999px;

font-size:1rem;

font-weight:600;

cursor:pointer;

background:white;

color:#2563eb;

transition:.25s;

}

button:hover{

transform:scale(1.02);

}

button:active{

transform:scale(.98);

}

@media(max-width:500px){

.temp{

font-size:72px;

}

#icon{

font-size:70px;

}

}

</style>

</head>

<body>

<main>

<div class="header">

<h1>Sanford SkyStation</h1>

<p>Sanford, Florida</p>

</div>

<div class="hero">

<div id="icon">☀️</div>

<div class="temp" id="temp">--°F</div>

<div class="desc" id="desc">

Loading weather...

</div>

<div class="feels" id="feels">

Feels like --°F

</div>

</div>

<div class="grid">

<div class="card">

<div class="label">

💨 Wind

</div>

<div class="value" id="wind">

--

</div>

</div>

<div class="card">

<div class="label">

💧 Humidity

</div>

<div class="value" id="humidity">

--

</div>

</div>

<div class="card">

<div class="label">

👀 Visibility

</div>

<div class="value" id="visibility">

--

</div>

</div>

<div class="card">

<div class="label">

🌡 Pressure

</div>

<div class="value" id="pressure">

--

</div>

</div>

</div>

<div class="status" id="status">

Connecting...

</div>

<button id="refresh">

Refresh Weather

</button>

<script>const STATIONS=["KSFB","KMCO"];

function $(id){
return document.getElementById(id);
}

function weatherIcon(text){

text=(text||"").toLowerCase();

if(text.includes("thunder")) return "⛈️";
if(text.includes("rain")) return "🌧️";
if(text.includes("drizzle")) return "🌦️";
if(text.includes("cloud")) return "☁️";
if(text.includes("fog")) return "🌫️";
if(text.includes("snow")) return "🌨️";
if(text.includes("clear")) return "☀️";
if(text.includes("sun")) return "🌤️";

return "🌎";

}

async function getObservation(station){

const res=await fetch("https://api.weather.gov/stations/"+station+"/observations/latest");

if(!res.ok) throw new Error(station);

const data=await res.json();

return{
station,
p:data.properties
};

}

async function loadWeather(){

const btn=$("refresh");

btn.disabled=true;

$("status").textContent="Updating...";

try{

let obs=null;

for(const station of STATIONS){

try{

obs=await getObservation(station);

break;

}catch{}

}

if(!obs) throw new Error("No weather");

const p=obs.p;

const temp=p.temperature.value*9/5+32;

const humidity=Math.round(p.relativeHumidity.value||0);

const wind=p.windSpeed.value==null
?"Calm"
:Math.round(p.windSpeed.value*.621371)+" mph";

const pressure=p.barometricPressure.value
?Math.round(p.barometricPressure.value/100)+" hPa"
:"--";

const visibility=p.visibility.value
?Math.round(p.visibility.value/1609)+" mi"
:"--";

const feels=temp;

$("icon").textContent=weatherIcon(p.textDescription);

$("temp").textContent=Math.round(temp)+"°F";

$("desc").textContent=p.textDescription||"Unknown";

$("feels").textContent="Feels like "+Math.round(feels)+"°F";

$("wind").textContent=wind;

$("humidity").textContent=humidity+"%";

$("visibility").textContent=visibility;

$("pressure").textContent=pressure;

$("status").textContent="Live from "+obs.station;    if (/night/i.test(p.icon || "")) {
      document.documentElement.style.setProperty("--skyTop","#0f172a");
      document.documentElement.style.setProperty("--skyBottom","#334155");
    } else if (/rain|drizzle|storm|thunder/i.test(p.textDescription || "")) {
      document.documentElement.style.setProperty("--skyTop","#475569");
      document.documentElement.style.setProperty("--skyBottom","#64748b");
    } else {
      document.documentElement.style.setProperty("--skyTop","#3b82f6");
      document.documentElement.style.setProperty("--skyBottom","#93c5fd");
    }

  }catch(err){

    $("desc").textContent="Couldn't load weather";

    $("status").textContent=err.message;

    console.error(err);

  }finally{

    btn.disabled=false;

  }

}

$("refresh").addEventListener("click",loadWeather);

loadWeather();

</script>

</body>

</html>
